# An isolated server: no user tmux configuration or unrelated sessions.
new-session -d -s claude -x 120 -y 40 -c "$HOME" '"$HOME/.local/bin/start-claude" --session'
# Private terminal log for errors if Claude exits before the launcher captures
# its screen. It is truncated at each service start and may contain chat text.
pipe-pane -t =claude: 'umask 077; cat >> "$HOME/.cache/roles/claude.log"'
set-option -s exit-empty on
